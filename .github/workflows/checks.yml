name: checks

on:
  push:
  pull_request:

jobs:
  lua-and-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lua 5.1 syntax, GLua operators, unknown globals, unused locals
        run: python -I tools/luacheck51.py --strict $(find lua -name '*.lua')
      - name: Voxel key bit math
        run: python -I tools/test_bitmath.py
      - name: Solver physics (mass conservation, buoyancy)
        run: python -I tools/test_solver_physics.py
      - name: Release check (modules, AddCSLuaFile, assets, net messages, icons, addon.json)
        run: python -I tools/release_check.py
